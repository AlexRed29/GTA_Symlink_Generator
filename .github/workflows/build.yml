name: Build GTA Symlink Generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "GTA Symlink Generator.vcxproj" /p:Configuration=Release /p:Platform=Win32

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GTASymlinkGenerator-Windows-x86
          path: "Release/GTASymlinkGenerator.exe"

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload executable and languages
        uses: actions/upload-artifact@v4
        with:
          name: GTASymlinkGenerator-Linux-x64
          path: |
            build/GTASymlinkGenerator
            build/languages/
